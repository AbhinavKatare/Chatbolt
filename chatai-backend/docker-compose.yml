version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatai_backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/chatai
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
